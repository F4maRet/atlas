# Режим разработки: автоперезагрузка backend при изменении кода.
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
# Фронтенд удобнее запускать локально: cd frontend && npm run dev (http://localhost:5173)
services:
  backend:
    volumes:
      - ./backend/app:/app/app
      - ./backend/migrations:/app/migrations
      - uploads_data:/app/uploads
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    environment:
      ALLOWED_ORIGINS: http://localhost,http://localhost:80,http://localhost:5173
  db:
    ports:
      - "127.0.0.1:5432:5432"
