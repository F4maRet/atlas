services:
  db:
    image: postgres:16-alpine
    container_name: atlas_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-atlas}
      POSTGRES_USER: ${POSTGRES_USER:-atlas_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atlas_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Схему создаёт и обновляет сам backend (backend/migrations, таблица schema_migrations).
    # Порт БД наружу не публикуется: доступ — через pgAdmin (--profile tools)
    # или `docker compose exec db psql -U atlas_user atlas`.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-atlas_user} -d ${POSTGRES_DB:-atlas}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: atlas_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-atlas_user}:${POSTGRES_PASSWORD:-atlas_pass}@db:5432/${POSTGRES_DB:-atlas}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-very-long-secret-key}
      UPLOAD_DIR: /app/uploads
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-100}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost,http://localhost:80}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
    volumes:
      - uploads_data:/app/uploads
    # Снаружи backend доступен только с этого же компьютера; пользователи ходят через nginx (порт 80)
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    container_name: atlas_frontend
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: atlas_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@atlas.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      - db
    profiles:
      - tools

volumes:
  postgres_data:
  uploads_data:
